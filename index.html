<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarav Kumar - Personal Drive Box</title>
    <style>
        :root {
            --bg-body: #f8f9fa;
            --sidebar-bg: #ffffff;
            --border-color: #dadce0;
            --text-main: #202124;
            --text-secondary: #5f6368;
            --accent-blue: #1a73e8;
            --accent-hover: #1558b0;
            --danger-red: #d93025;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Google Sans', 'Segoe UI', Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Smooth Keyframe Animations */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardPopIn {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 1px 3px 0 rgba(26, 115, 232, 0.2); }
            50% { box-shadow: 0 4px 14px 0 rgba(26, 115, 232, 0.35); }
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            height: 64px;
            flex-shrink: 0;
            animation: slideDown 0.4s ease-out;
            z-index: 20;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .drive-icon {
            width: 36px;
            height: 36px;
            transition: transform 0.3s ease;
        }

        .header-left:hover .drive-icon {
            transform: rotate(-8deg) scale(1.08);
        }

        .header-title {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .header-title span {
            color: var(--accent-blue);
            font-weight: 600;
        }

        .user-welcome {
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 600;
            background: #e8f0fe;
            color: var(--accent-blue);
            padding: 8px 16px;
            border-radius: 24px;
            border: 1px solid #d2e3fc;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .user-welcome:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(26, 115, 232, 0.2);
        }

        /* Main Workspace Layout */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Style */
        aside {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .new-btn {
            background: #ffffff;
            color: #3c4043;
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 28px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            justify-content: center;
            animation: pulseGlow 3s infinite;
        }

        .new-btn:hover {
            background: #f8f9fa;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.2);
        }

        .new-btn:active {
            transform: translateY(0);
        }

        #fileInput {
            display: none;
        }

        /* Navigation Filter Links in Sidebar */
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 8px;
        }

        .nav-item {
            padding: 10px 16px;
            border-radius: 0 24px 24px 0;
            margin-left: -16px;
            padding-left: 24px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            border: none;
            background: transparent;
            text-align: left;
        }

        .nav-item:hover {
            background: #f1f3f4;
            color: var(--text-main);
        }

        .nav-item.active {
            background: #e8f0fe;
            color: var(--accent-blue);
            font-weight: 600;
        }

        /* 100GB Storage Widget inside Sidebar */
        .storage-section {
            background: #f8f9fa;
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            margin-top: auto;
            transition: transform 0.2s ease;
        }

        .storage-section:hover {
            transform: translateY(-2px);
        }

        .storage-label {
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .storage-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .storage-fill {
            width: 15%;
            height: 100%;
            background: linear-gradient(90deg, #1a73e8, #4285f4);
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .storage-info-text {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Content Area Style (Fixed from invalid <content-area> tag) */
        main.content-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: #ffffff;
            margin: 12px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: block;
            box-shadow: 0 1px 2px rgba(60, 64, 67, 0.05);
        }

        .content-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1f3f4;
        }

        .content-heading {
            font-size: 1.05rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .file-count-badge {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: #f1f3f4;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 500;
        }

        .drive-files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
        }

        .file-box {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.28s ease, border-color 0.2s ease;
            animation: cardPopIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) backwards;
            position: relative;
        }

        .file-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(60, 64, 67, 0.12);
            border-color: #a8c7fa;
        }

        .preview-wrapper {
            width: 100%;
            height: 150px;
            overflow: hidden;
            background: #f1f3f4;
            position: relative;
            cursor: pointer;
        }

        .file-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .file-box:hover .file-preview {
            transform: scale(1.06);
        }

        .file-details {
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f3f4;
            background: #ffffff;
            gap: 8px;
        }

        .file-title {
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .file-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .action-btn:hover {
            background: #e8f0fe;
        }

        .delete-btn {
            color: var(--danger-red);
        }

        .delete-btn:hover {
            background: #fce8e6;
        }

        /* Fullscreen Animated Lightbox Modal */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(15, 17, 20, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            max-width: 92%;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: scale(0.92);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .lightbox.active .lightbox-content {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 28px;
            color: #ffffff;
            font-size: 2.2rem;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            transition: background 0.2s, transform 0.2s;
        }

        .lightbox-close:hover {
            background: rgba(255,255,255,0.25);
            transform: rotate(90deg);
        }

        /* Animated Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #202124;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 500;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
                min-height: 100vh;
            }
            header {
                padding: 10px 14px;
                position: sticky;
                top: 0;
            }
            .header-title {
                font-size: 1.05rem;
            }
            .user-welcome {
                font-size: 0.8rem;
                padding: 6px 12px;
            }
            .main-container {
                flex-direction: column;
                overflow: visible;
            }
            aside {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 14px 16px;
                gap: 14px;
            }
            .nav-menu {
                flex-direction: row;
                overflow-x: auto;
                gap: 8px;
            }
            .nav-item {
                border-radius: 20px;
                margin-left: 0;
                padding: 8px 16px;
                white-space: nowrap;
            }
            main.content-area {
                margin: 0;
                border: none;
                border-radius: 0;
                padding: 16px;
            }
            .drive-files-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }
            .preview-wrapper {
                height: 130px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Drive Navigation Bar -->
    <header>
        <div class="header-left">
            <svg class="drive-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
            </svg>
            <div class="header-title">Google Drive <span>(Aarav Storage)</span></div>
        </div>
        <div class="user-welcome">
            Welcome, Aarav Kumar
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="main-container">
        <!-- Sidebar -->
        <aside>
            <div class="sidebar-top">
                <label class="new-btn" for="fileInput">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#1a73e8" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                    New Upload
                </label>
                <input type="file" id="fileInput" multiple accept="image/*,video/*">

                <div class="nav-menu">
                    <button class="nav-item active" onclick="filterDrive('all', this)">All Drive Files</button>
                    <button class="nav-item" onclick="filterDrive('image', this)">Photos</button>
                    <button class="nav-item" onclick="filterDrive('video', this)">Videos</button>
                </div>
            </div>

            <!-- 100GB Storage Meter -->
            <div class="storage-section">
                <div class="storage-label">
                    <span>Storage Plan</span>
                    <span>100 GB</span>
                </div>
                <div class="storage-bar">
                    <div class="storage-fill" id="storageFillBar"></div>
                </div>
                <div class="storage-info-text" id="storageText">15.0 GB of 100 GB used</div>
            </div>
        </aside>

        <!-- Drive Content Box Area -->
        <main class="content-area">
            <div class="content-header-bar">
                <div class="content-heading">My Drive Files & Media</div>
                <div class="file-count-badge" id="itemCountBadge">2 items</div>
            </div>
            <div class="drive-files-grid" id="driveFilesGrid"></div>
        </main>
    </div>

    <!-- Animated Fullscreen Lightbox Modal -->
    <div class="lightbox" id="lightboxModal" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
        <div id="lightboxMediaContainer"></div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toastMsg">File uploaded successfully!</div>

    <script>
        // Permanent & Local Media List
        let cloudFiles = [
            {
                id: 1,
                type: 'image',
                src: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800',
                name: 'Karnataka_Sunrise.jpg',
                sizeGB: 7.5
            },
            {
                id: 2,
                type: 'image',
                src: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800',
                name: 'Golden_Hour.jpg',
                sizeGB: 7.5
            }
        ];

        let currentFilter = 'all';

        function updateStorageMeter() {
            const totalGB = 100;
            const usedGB = cloudFiles.reduce((acc, item) => acc + (item.sizeGB || 1.2), 0);
            const clampedGB = Math.min(usedGB, totalGB).toFixed(1);
            const percentage = Math.min((usedGB / totalGB) * 100, 100);

            document.getElementById('storageFillBar').style.width = percentage + '%';
            document.getElementById('storageText').innerText = `${clampedGB} GB of 100 GB used`;
        }

        function renderDriveFiles() {
            const grid = document.getElementById('driveFilesGrid');
            grid.innerHTML = '';

            const filtered = cloudFiles.filter(f => currentFilter === 'all' || f.type === currentFilter);
            document.getElementById('itemCountBadge').innerText = `${filtered.length} ${filtered.length === 1 ? 'item' : 'items'}`;

            filtered.forEach((file, index) => {
                const box = document.createElement('div');
                box.className = 'file-box';
                // Staggered animation delay for smooth professional entrance
                box.style.animationDelay = `${index * 0.06}s`;

                let mediaHTML = '';
                if (file.type === 'image') {
                    mediaHTML = `
                        <div class="preview-wrapper" onclick="openLightbox('image', '${file.src}')">
                            <img src="${file.src}" class="file-preview" alt="${file.name}" loading="lazy">
                        </div>`;
                } else {
                    mediaHTML = `
                        <div class="preview-wrapper" onclick="openLightbox('video', '${file.src}')">
                            <video src="${file.src}" class="file-preview" muted preload="metadata"></video>
                        </div>`;
                }

                box.innerHTML = `
                    ${mediaHTML}
                    <div class="file-details">
                        <span class="file-title" title="${file.name}">${file.name}</span>
                        <div class="file-actions">
                            <a class="action-btn" href="${file.src}" download="${file.name}" target="_blank">Save</a>
                            <button class="action-btn delete-btn" onclick="deleteFile(${file.id})">Delete</button>
                        </div>
                    </div>
                `;
                grid.appendChild(box);
            });

            updateStorageMeter();
        }

        function filterDrive(type, btn) {
            currentFilter = type;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            renderDriveFiles();
        }

        // Upload files with animated toast and live storage bar update
        document.getElementById('fileInput').addEventListener('change', function(event) {
            const files = event.target.files;
            if (!files.length) return;

            for (let file of files) {
                const fileURL = URL.createObjectURL(file);
                const isVideo = file.type.startsWith('video');
                cloudFiles.unshift({
                    id: Date.now() + Math.random(),
                    type: isVideo ? 'video' : 'image',
                    src: fileURL,
                    name: file.name,
                    sizeGB: isVideo ? 3.5 : 1.2
                });
            }

            renderDriveFiles();
            showToast(`${files.length} file(s) uploaded to Drive!`);
            event.target.value = '';
        });

        function deleteFile(id) {
            cloudFiles = cloudFiles.filter(file => file.id !== id);
            renderDriveFiles();
            showToast('File removed from Drive');
        }

        // Lightbox Preview Functions
        function openLightbox(type, src) {
            const modal = document.getElementById('lightboxModal');
            const container = document.getElementById('lightboxMediaContainer');
            if (type === 'image') {
                container.innerHTML = `<img src="${src}" class="lightbox-content">`;
            } else {
                container.innerHTML = `<video src="${src}" class="lightbox-content" controls autoplay></video>`;
            }
            modal.classList.add('active');
        }

        function closeLightbox(event) {
            if (event.target.id === 'lightboxModal' || event.target.classList.contains('lightbox-close')) {
                const modal = document.getElementById('lightboxModal');
                modal.classList.remove('active');
                document.getElementById('lightboxMediaContainer').innerHTML = '';
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toastMsg');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2600);
        }

        // Initialize Drive on Load
        renderDriveFiles();
    </script>
</body>
</html>
