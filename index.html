<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud File Uploader</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .upload-card {
            background-color: #1a1a1a;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 1px solid #2e2e2e;
        }
        h2 {
            margin-top: 0;
            font-size: 22px;
        }
        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
            background: #252525;
            border-radius: 8px;
            color: #ccc;
            width: 90%;
            border: 1px dashed #444;
        }
        .btn {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        #status {
            margin-top: 18px;
            font-size: 14px;
            color: #a1a1aa;
            word-break: break-all;
        }
        #preview {
            margin-top: 15px;
            max-width: 100%;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="upload-card">
        <h2>Upload to Cloud Storage</h2>
        <input type="file" id="fileInput" accept="image/*,video/*">
        <button class="btn" onclick="uploadToCloudinary()">Upload File</button>
        <p id="status">Select a photo or video to upload.</p>
        <img id="preview" alt="Uploaded preview">
    </div>

    <script>
        // Your Cloudinary Configuration
        const CLOUD_NAME = "dmhwtzzqi";
        const API_KEY = "388174674157577";
        const UPLOAD_PRESET = "YOUR_UPLOAD_PRESET_NAME"; // <-- Paste your Unsigned Upload Preset name here

        async function uploadToCloudinary() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            const preview = document.getElementById('preview');

            if (!fileInput.files.length) {
                status.innerText = "Please choose a file first!";
                status.style.color = "#ef4444";
                return;
            }

            const file = fileInput.files[0];
            status.innerText = "Uploading to Cloudinary...";
            status.style.color = "#facc15";

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            formData.append('api_key', API_KEY);

            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    status.innerHTML = `Upload Complete! <br><a href="${data.secure_url}" target="_blank" style="color: #60a5fa;">View Direct Link</a>`;
                    status.style.color = "#4ade80";
                    if (data.resource_type === "image") {
                        preview.src = data.secure_url;
                        preview.style.display = "block";
                    }
                } else {
                    status.innerText = "Error: " + (data.error ? data.error.message : "Upload failed");
                    status.style.color = "#ef4444";
                }
            } catch (error) {
                status.innerText = "Network Error: Could not connect to Cloudinary.";
                status.style.color = "#ef4444";
            }
        }
    </script>

</body>
</html>
