<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarav Kumar - Personal Drive Box</title>
    <style>
        :root {
            --bg-body: #f8f9fa;
            --sidebar-bg: #ffffff;
            --border-color: #dadce0;
            --text-main: #202124;
            --text-secondary: #5f6368;
            --accent-blue: #1a73e8;
            --accent-hover: #1558b0;
            --danger-red: #d93025;
            --success-green: #1e8e3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Google Sans', 'Segoe UI', Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardPopIn {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 1px 3px 0 rgba(26, 115, 232, 0.2); }
            50% { box-shadow: 0 4px 14px 0 rgba(26, 115, 232, 0.35); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            height: 64px;
            flex-shrink: 0;
            animation: slideDown 0.4s ease-out;
            z-index: 20;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .drive-icon {
            width: 36px;
            height: 36px;
            transition: transform 0.3s ease;
        }

        .header-left:hover .drive-icon {
            transform: rotate(-8deg) scale(1.08);
        }

        .header-title {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .header-title span {
            color: var(--accent-blue);
            font-weight: 600;
        }

        .user-welcome {
            font-size: 0.9rem;
            font-weight: 600;
            background: #e8f0fe;
            color: var(--accent-blue);
            padding: 8px 16px;
            border-radius: 24px;
            border: 1px solid #d2e3fc;
        }

        /* Main Workspace Layout */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Style */
        aside {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .new-btn {
            background: var(--accent-blue);
            color: #ffffff;
            border: none;
            padding: 13px 20px;
            border-radius: 28px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            justify-content: center;
            animation: pulseGlow 3s infinite;
        }

        .new-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
        }

        .new-btn.uploading {
            background: #5f6368;
            pointer-events: none;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .new-btn.uploading .spinner {
            display: inline-block;
        }

        #fileInput {
            display: none;
        }

        /* Navigation Filter Links in Sidebar */
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 6px;
        }

        .nav-item {
            padding: 10px 16px;
            border-radius: 0 24px 24px 0;
            margin-left: -16px;
            padding-left: 24px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            border: none;
            background: transparent;
            text-align: left;
        }

        .nav-item:hover {
            background: #f1f3f4;
            color: var(--text-main);
        }

        .nav-item.active {
            background: #e8f0fe;
            color: var(--accent-blue);
            font-weight: 600;
        }

        /* 100GB Storage Widget inside Sidebar */
        .storage-section {
            background: #f8f9fa;
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            margin-top: auto;
        }

        .storage-label {
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .storage-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .storage-fill {
            width: 15%;
            height: 100%;
            background: linear-gradient(90deg, #1a73e8, #4285f4);
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .storage-info-text {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 10px;
        }

        .sync-key-btn {
            width: 100%;
            padding: 7px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 6px;
            border: 1px dashed var(--accent-blue);
            background: #e8f0fe;
            color: var(--accent-blue);
            cursor: pointer;
            transition: background 0.2s;
        }

        .sync-key-btn.connected {
            border: 1px solid #ceead6;
            background: #e6f4ea;
            color: var(--success-green);
        }

        /* Content Area Style */
        main.content-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: #ffffff;
            margin: 12px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: block;
            box-shadow: 0 1px 2px rgba(60, 64, 67, 0.05);
        }

        .content-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1f3f4;
        }

        .content-heading {
            font-size: 1.05rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .file-count-badge {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: #f1f3f4;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 500;
        }

        .drive-files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
        }

        .file-box {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.28s ease, border-color 0.2s ease;
            animation: cardPopIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) backwards;
            position: relative;
        }

        .file-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(60, 64, 67, 0.12);
            border-color: #a8c7fa;
        }

        .preview-wrapper {
            width: 100%;
            height: 150px;
            overflow: hidden;
            background: #f1f3f4;
            position: relative;
            cursor: pointer;
        }

        .file-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .file-box:hover .file-preview {
            transform: scale(1.06);
        }

        .file-details {
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f3f4;
            background: #ffffff;
            gap: 8px;
        }

        .file-title {
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .file-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .action-btn:hover {
            background: #e8f0fe;
        }

        .delete-btn {
            color: var(--danger-red);
        }

        .delete-btn:hover {
            background: #fce8e6;
        }

        /* Lightbox Modal */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(15, 17, 20, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            max-width: 92%;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 28px;
            color: #ffffff;
            font-size: 2.2rem;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #202124;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 500;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
                min-height: 100vh;
            }
            header {
                padding: 10px 14px;
                position: sticky;
                top: 0;
            }
            .header-title {
                font-size: 1.05rem;
            }
            .user-welcome {
                font-size: 0.8rem;
                padding: 6px 12px;
            }
            .main-container {
                flex-direction: column;
                overflow: visible;
            }
            aside {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 14px 16px;
                gap: 14px;
            }
            .nav-menu {
                flex-direction: row;
                overflow-x: auto;
                gap: 8px;
            }
            .nav-item {
                border-radius: 20px;
                margin-left: 0;
                padding: 8px 16px;
                white-space: nowrap;
            }
            main.content-area {
                margin: 0;
                border: none;
                border-radius: 0;
                padding: 16px;
            }
            .drive-files-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }
            .preview-wrapper {
                height: 130px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Drive Navigation Bar -->
    <header>
        <div class="header-left">
            <svg class="drive-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
            </svg>
            <div class="header-title">Google Drive <span>(Aarav Storage)</span></div>
        </div>
        <div class="user-welcome">
            Welcome, Aarav Kumar
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="main-container">
        <!-- Sidebar -->
        <aside>
            <div class="sidebar-top">
                <!-- Direct Upload Button -->
                <label class="new-btn" id="uploadBtnLabel" for="fileInput">
                    <div class="spinner"></div>
                    <svg width="20" height="20" viewBox="0 0 24 24" id="plusIcon">
                        <path fill="#ffffff" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                    <span id="uploadBtnText">New Upload</span>
                </label>
                <input type="file" id="fileInput" multiple accept="image/*,video/*">

                <div class="nav-menu">
                    <button class="nav-item active" onclick="filterDrive('all', this)">All Drive Files</button>
                    <button class="nav-item" onclick="filterDrive('image', this)">Photos</button>
                    <button class="nav-item" onclick="filterDrive('video', this)">Videos</button>
                </div>
            </div>

            <!-- 100GB Storage Meter -->
            <div class="storage-section">
                <div class="storage-label">
                    <span>Storage Plan</span>
                    <span>100 GB</span>
                </div>
                <div class="storage-bar">
                    <div class="storage-fill" id="storageFillBar"></div>
                </div>
                <div class="storage-info-text" id="storageText">15.0 GB of 100 GB used</div>
                <button class="sync-key-btn" id="syncKeyBtn" onclick="setupCloudKey()">
                    ⚙️ Connect Cloud Storage (1-Time)
                </button>
            </div>
        </aside>

        <!-- Drive Content Box Area -->
        <main class="content-area">
            <div class="content-header-bar">
                <div class="content-heading">My Drive Files & Media</div>
                <div class="file-count-badge" id="itemCountBadge">Loading...</div>
            </div>
            <div class="drive-files-grid" id="driveFilesGrid"></div>
        </main>
    </div>

    <!-- Animated Fullscreen Lightbox Modal -->
    <div class="lightbox" id="lightboxModal" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
        <div id="lightboxMediaContainer"></div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toastMsg">File uploaded successfully!</div>

    <script>
        const GITHUB_USER = 'aravkumarkamble7-oss';
        const GITHUB_REPO = 'aravkumarkamble7-oss.github.io';

        // Default permanent items
        let cloudFiles = [
            {
                id: 'default-1',
                type: 'image',
                src: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800',
                name: 'Karnataka_Sunrise.jpg',
                sizeGB: 7.5
            },
            {
                id: 'default-2',
                type: 'image',
                src: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800',
                name: 'Golden_Hour.jpg',
                sizeGB: 7.5
            }
        ];

        let currentFilter = 'all';

        // Check if 1-time cloud key is connected
        function updateKeyButtonStatus() {
            const token = localStorage.getItem('aarav_drive_token');
            const btn = document.getElementById('syncKeyBtn');
            if (token) {
                btn.innerText = '✓ Direct Cloud Upload Active';
                btn.classList.add('connected');
            } else {
                btn.innerText = '⚙️ Connect Cloud Storage (1-Time)';
                btn.classList.remove('connected');
            }
        }

        function setupCloudKey() {
            const current = localStorage.getItem('aarav_drive_token') || '';
            const input = prompt(
                "Paste your GitHub Personal Access Token (starts with ghp_ or github_pat_) so the 'New Upload' button saves directly to your online storage across all devices:",
                current
            );
            if (input !== null) {
                if (input.trim() !== '') {
                    localStorage.setItem('aarav_drive_token', input.trim());
                    showToast('Cloud Storage Connected! Direct uploads are now permanent.');
                } else {
                    localStorage.removeItem('aarav_drive_token');
                    showToast('Cloud key removed.');
                }
                updateKeyButtonStatus();
            }
        }

        // Convert selected file to Base64 for direct GitHub Cloud API upload
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    const base64String = reader.result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = error => reject(error);
            });
        }

        // Fetch all files stored in your GitHub Repository automatically
        async function syncGitHubRepoFiles() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/?t=${Date.now()}`);
                if (!response.ok) return;
                const data = await response.json();

                const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'];
                const videoExts = ['mp4', 'webm', 'ogg', 'mov', 'mkv'];

                data.forEach(item => {
                    if (item.type === 'file') {
                        const ext = item.name.split('.').pop().toLowerCase();
                        let mediaType = null;
                        if (imageExts.includes(ext)) mediaType = 'image';
                        if (videoExts.includes(ext)) mediaType = 'video';

                        if (mediaType) {
                            const alreadyExists = cloudFiles.some(f => f.name === item.name);
                            if (!alreadyExists) {
                                cloudFiles.unshift({
                                    id: item.sha,
                                    sha: item.sha,
                                    type: mediaType,
                                    src: item.download_url,
                                    name: item.name,
                                    sizeGB: mediaType === 'video' ? 3.5 : 1.2
                                });
                            }
                        }
                    }
                });

                renderDriveFiles();
            } catch (err) {
                console.log('Sync info:', err);
            }
        }

        // Direct Upload from Website Button -> Permanent Cloud
        document.getElementById('fileInput').addEventListener('change', async function(event) {
            const files = event.target.files;
            if (!files.length) return;

            const token = localStorage.getItem('aarav_drive_token');
            const btnLabel = document.getElementById('uploadBtnLabel');
            const btnText = document.getElementById('uploadBtnText');

            btnLabel.classList.add('uploading');
            btnText.innerText = 'Uploading...';

            for (let file of files) {
                const isVideo = file.type.startsWith('video');
                const safeName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;

                if (token) {
                    // PERMANENT CLOUD UPLOAD VIA GITHUB API
                    try {
                        const base64Data = await fileToBase64(file);
                        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${safeName}`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `Direct upload ${safeName} from Drive Box`,
                                content: base64Data
                            })
                        });

                        if (res.ok) {
                            const result = await res.json();
                            cloudFiles.unshift({
                                id: result.content.sha,
                                sha: result.content.sha,
                                type: isVideo ? 'video' : 'image',
                                src: result.content.download_url,
                                name: safeName,
                                sizeGB: isVideo ? 3.5 : 1.2
                            });
                            showToast(`✓ Saved "${file.name}" permanently to Cloud!`);
                        } else {
                            alert('Cloud Upload failed. Please check your 1-Time Cloud Key or file size (max 25MB per file).');
                        }
                    } catch (err) {
                        console.error(err);
                        alert('Network error while uploading to cloud.');
                    }
                } else {
                    // Fallback to local browser storage if key isn't entered yet
                    const fileURL = URL.createObjectURL(file);
                    cloudFiles.unshift({
                        id: String(Date.now() + Math.random()),
                        type: isVideo ? 'video' : 'image',
                        src: fileURL,
                        name: file.name,
                        sizeGB: isVideo ? 3.5 : 1.2
                    });
                    showToast('Preview added! Click "Connect Cloud Storage" in sidebar to make uploads permanent across devices.');
                }
            }

            btnLabel.classList.remove('uploading');
            btnText.innerText = 'New Upload';
            event.target.value = '';
            renderDriveFiles();
        });

        function updateStorageMeter() {
            const totalGB = 100;
            const usedGB = cloudFiles.reduce((acc, item) => acc + (item.sizeGB || 1.2), 0);
            const clampedGB = Math.min(usedGB, totalGB).toFixed(1);
            const percentage = Math.min((usedGB / totalGB) * 100, 100);

            document.getElementById('storageFillBar').style.width = percentage + '%';
            document.getElementById('storageText').innerText = `${clampedGB} GB of 100 GB used`;
        }

        function renderDriveFiles() {
            const grid = document.getElementById('driveFilesGrid');
            grid.innerHTML = '';

            const filtered = cloudFiles.filter(f => currentFilter === 'all' || f.type === currentFilter);
            document.getElementById('itemCountBadge').innerText = `${filtered.length} ${filtered.length === 1 ? 'item' : 'items'}`;

            filtered.forEach((file, index) => {
                const box = document.createElement('div');
                box.className = 'file-box';
                box.style.animationDelay = `${index * 0.05}s`;

                let mediaHTML = '';
                if (file.type === 'image') {
                    mediaHTML = `
                        <div class="preview-wrapper" onclick="openLightbox('image', '${file.src}')">
                            <img src="${file.src}" class="file-preview" alt="${file.name}" loading="lazy">
                        </div>`;
                } else {
                    mediaHTML = `
                        <div class="preview-wrapper" onclick="openLightbox('video', '${file.src}')">
                            <video src="${file.src}" class="file-preview" muted preload="metadata"></video>
                        </div>`;
                }

                box.innerHTML = `
                    ${mediaHTML}
                    <div class="file-details">
                        <span class="file-title" title="${file.name}">${file.name}</span>
                        <div class="file-actions">
                            <a class="action-btn" href="${file.src}" download="${file.name}" target="_blank">Save</a>
                            <button class="action-btn delete-btn" onclick="deleteFile('${file.id}', '${file.name}', '${file.sha || ''}')">Delete</button>
                        </div>
                    </div>
                `;
                grid.appendChild(box);
            });

            updateStorageMeter();
        }

        function filterDrive(type, btn) {
            currentFilter = type;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            renderDriveFiles();
        }

        async function deleteFile(id, fileName, sha) {
            const token = localStorage.getItem('aarav_drive_token');
            if (token && sha) {
                try {
                    await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${fileName}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Delete ${fileName}`,
                            sha: sha
                        })
                    });
                } catch (e) {
                    console.log('Cloud delete error:', e);
                }
            }
            cloudFiles = cloudFiles.filter(file => String(file.id) !== String(id));
            renderDriveFiles();
            showToast('File deleted');
        }

        function openLightbox(type, src) {
            const modal = document.getElementById('lightboxModal');
            const container = document.getElementById('lightboxMediaContainer');
            if (type === 'image') {
                container.innerHTML = `<img src="${src}" class="lightbox-content">`;
            } else {
                container.innerHTML = `<video src="${src}" class="lightbox-content" controls autoplay></video>`;
            }
            modal.classList.add('active');
        }

        function closeLightbox(event) {
            if (event.target.id === 'lightboxModal' || event.target.classList.contains('lightbox-close')) {
                const modal = document.getElementById('lightboxModal');
                modal.classList.remove('active');
                document.getElementById('lightboxMediaContainer').innerHTML = '';
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toastMsg');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3200);
        }

        // Initialize on load
        updateKeyButtonStatus();
        renderDriveFiles();
        syncGitHubRepoFiles();
    </script>
</body>
</html>
